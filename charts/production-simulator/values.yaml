replicaCount: 2
image:
  repository: production-simulator
  tag: local
  pullPolicy: IfNotPresent
service:
  type: NodePort
  port: 8080
  nodePort: 30080
prometheus:
  image: prom/prometheus:v3.5.0
  service:
    type: NodePort
    port: 9090
    nodePort: 30090
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
