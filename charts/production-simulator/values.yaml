replicaCount: 2
image:
  repository: production-simulator
  tag: local
  pullPolicy: IfNotPresent
service:
  type: LoadBalancer
  port: 18080
  nodePort: 30080
prometheus:
  image: prom/prometheus:v3.5.0
  service:
    type: LoadBalancer
    port: 19090
    nodePort: 30090
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
