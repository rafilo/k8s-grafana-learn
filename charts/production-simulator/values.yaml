replicaCount: 2
ibmSimulator:
  enabled: false
  image: ibm-api-simulator:local
  imagePullPolicy: IfNotPresent
  clientId: demo-client
  rateLimit: 10
  rateWindowSeconds: 60
  serviceType: LoadBalancer
  gatewayPort: 18081
  managementPort: 18082
  anypointEnabled: false
  anypointPort: 18083
image:
  repository: production-simulator
  tag: local
  pullPolicy: IfNotPresent
service:
  type: LoadBalancer
  port: 18080
  nodePort: 30080
prometheus:
  image: prom/prometheus:v3.5.0
  alerting:
    enabled: true
    thresholds:
      processCpuRatio: 0.80
      heapUsageRatio: 0.80
      errorRateRatio: 0.05
      averageLatencyMs: 250
      cpuThrottlingRatio: 0.25
      containerMemoryLimitRatio: 0.90
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: standard
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  service:
    type: LoadBalancer
    port: 19090
    nodePort: 30090
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
kubernetesMetrics:
  enabled: true
  kubeStateMetricsImage: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.17.0
  scrapeInterval: 15s
  # API-server proxy requires cluster-scoped nodes/proxy access for Prometheus.
  cadvisorEnabled: true
