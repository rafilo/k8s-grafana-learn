apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "production-simulator.fullname" . }}-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "production-simulator.name" . }}-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "production-simulator.name" . }}-prometheus
      annotations:
        checksum/prometheus-config: {{ include (print $.Template.BasePath "/prometheus-configmap.yaml") . | sha256sum }}
{{- if .Values.prometheus.alerting.enabled }}
        checksum/prometheus-alert-rules: {{ include (print $.Template.BasePath "/prometheus-alert-rules.yaml") . | sha256sum }}
{{- end }}
    spec:
      serviceAccountName: {{ include "production-simulator.fullname" . }}-prometheus-sa
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
{{- if .Values.prometheus.alerting.enabled }}
            - name: alert-rules
              mountPath: /etc/prometheus/rules
              readOnly: true
{{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "production-simulator.fullname" . }}-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-prometheus-data" (include "production-simulator.fullname" .)) .Values.prometheus.persistence.existingClaim }}
{{- if .Values.prometheus.alerting.enabled }}
        - name: alert-rules
          configMap:
            name: {{ include "production-simulator.fullname" . }}-prometheus-alert-rules
{{- end }}
