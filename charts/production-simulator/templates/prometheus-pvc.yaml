{{- if and .Values.prometheus.persistence.enabled (not .Values.prometheus.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "production-simulator.fullname" . }}-prometheus-data
  labels:
    app.kubernetes.io/name: {{ include "production-simulator.name" . }}-prometheus
spec:
  accessModes:
{{ toYaml .Values.prometheus.persistence.accessModes | indent 4 }}
  resources:
    requests:
      storage: {{ .Values.prometheus.persistence.size }}
  {{- with .Values.prometheus.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
