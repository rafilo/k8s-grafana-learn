apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "production-simulator.fullname" . }}-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      query_log_file: /prometheus/query.log
      scrape_failure_log_file: /prometheus/scrape-failures.log
{{- if .Values.prometheus.alerting.enabled }}
    rule_files:
      - /etc/prometheus/rules/*.yaml
{{- end }}
    scrape_configs:
{{ if .Values.ibmSimulator.enabled }}
      - job_name: ibm-simulators
        static_configs:
          - targets:
              - '{{ include "production-simulator.fullname" . }}-apic:{{ .Values.ibmSimulator.managementPort }}'
              - '{{ include "production-simulator.fullname" . }}-datapower:{{ .Values.ibmSimulator.gatewayPort }}'
{{ if .Values.ibmSimulator.anypointEnabled }}
              - '{{ include "production-simulator.fullname" . }}-mule:{{ .Values.ibmSimulator.anypointPort }}'
{{ end }}
{{ end }}
      - job_name: production-simulator
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{ .Release.Namespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: production-simulator
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
{{ if .Values.kubernetesMetrics.enabled }}
      - job_name: kube-state-metrics
        scrape_interval: {{ .Values.kubernetesMetrics.scrapeInterval }}
        static_configs:
          - targets:
              - '{{ include "production-simulator.fullname" . }}-kube-state-metrics:8080'
{{ if .Values.kubernetesMetrics.cadvisorEnabled }}
      - job_name: kubernetes-cadvisor
        scrape_interval: {{ .Values.kubernetesMetrics.scrapeInterval }}
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
        metric_relabel_configs:
          - source_labels: [namespace]
            action: keep
            regex: {{ .Release.Namespace | quote }}
          - source_labels: [__name__]
            action: keep
            regex: 'container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|memory_working_set_bytes|memory_rss|network_receive_bytes_total|network_transmit_bytes_total|network_receive_packets_dropped_total|network_transmit_packets_dropped_total|fs_usage_bytes|fs_limit_bytes)'
{{ end }}
{{ end }}
