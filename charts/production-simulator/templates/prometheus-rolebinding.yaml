apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "production-simulator.fullname" . }}-prometheus-binding
subjects:
  - kind: ServiceAccount
    name: {{ include "production-simulator.fullname" . }}-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "production-simulator.fullname" . }}-prometheus-role
