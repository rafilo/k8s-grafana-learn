apiVersion: v1
kind: Service
metadata:
  name: {{ include "production-simulator.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "production-simulator.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "production-simulator.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      nodePort: {{ .Values.service.nodePort }}
