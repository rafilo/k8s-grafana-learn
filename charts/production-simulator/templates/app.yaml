apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "production-simulator.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "production-simulator.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "production-simulator.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "production-simulator.name" . }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: checkout-api
            - name: ENVIRONMENT
              value: production
          resources:
{{ toYaml .Values.resources | indent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "production-simulator.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "production-simulator.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "production-simulator.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      nodePort: {{ .Values.service.nodePort }}
